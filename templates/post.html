<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#1b1919"><meta name="description" content="{{ post.summary }}"><title>{{ post.title }}｜{{ profile.title }}</title><link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Yomogi&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><div class="site-wrap">{% include '_header.html' %}<main class="post-page"><a class="back-link" href="/diary/">← 日記一覧へ</a><article class="post-paper"><header><time datetime="{{ post.date.isoformat() }}">{{ post.date_text }}</time><h1 class="hand">{{ post.title }}</h1><ul class="tag-list">{% for tag in post.tags %}<li># {{ tag }}</li>{% endfor %}</ul></header><div class="markdown-body">{{ post.body_html|safe }}</div></article><nav class="post-footer"><a href="/diary/">日記一覧へ戻る</a><a href="/">ホームへ</a></nav></main></div></body></html>
